<div class="form-wrapper">
  <form
    class="row text-start"
    (ngSubmit)="volDataSend()"
    [formGroup]="volDataForm"
  >
    <div class="card-header bg-transparent border-0">
      <div class="active-option">
        <div class="row">
          <div class="optionOne col d-flex align-items-center">
            <input
              formControlName="volDataType"
              value="noSelection"
              type="radio"
              class=""
              name="volDataType"
              id="noSelection"
              (click)="addUnspecifiedForm()"
            />
            <label
              for="noSelection"
              class="form-label ms-2 d-flex"
              (click)="addUnspecifiedForm()"
              >بدون تحديد
            </label>
          </div>
          <div class="optionTwo col d-flex align-items-center">
            <input
              formControlName="volDataType"
              value="volInvitation"
              type="radio"
              class=""
              name="volDataType"
              id="volInvitation"
              (click)="addInvitingVolforOpp()"
            />
            <label
              for="volInvitation"
              class="form-label ms-2"
              (click)="addInvitingVolforOpp()"
            >
              دعوة المتطوعين للفرصة
            </label>
          </div>
          <div class="optionThree col d-flex align-items-center">
            <input
              formControlName="volDataType"
              value="customizeOpp"
              type="radio"
              class=""
              name="volDataType"
              id="customizeOpp"
              (click)="addCustomizeOppToDepartmentForm()"
            />
            <label
              for="customizeOpp"
              class="form-label ms-2"
              (click)="addCustomizeOppToDepartmentForm()"
              >تخصيص الفرصة لقسم معين
            </label>
          </div>
        </div>
      </div>
    </div>

    <div formArrayName="volDataArray">
      <form
        *ngFor="let volDataGroup of volDataArray.controls; let i = index"
        [formGroupName]="i"
      >
        <!-- noSelection -->
        <div *ngIf="volDataType?.value == 'noSelection'" class="row">
          <div class="my-3 col-md-6 col-12 gender">
            <label for="gender" class="form-label mb-2">الجنس</label>
            <div class="mb-3">
              <select
                class="form-select"
                name="gender"
                id="gender"
                formControlName="gender"
                [class.is-invalid]="
                  volDataGroup.get('gender')?.invalid &&
                  volDataGroup.get('gender')?.touched &&
                  volDataGroup.get('gender')?.value == ''
                "
                [class.is-valid]="
                  volDataGroup.get('gender')?.valid &&
                  volDataGroup.get('gender')?.value != ''
                "
              >
                <option value="">اختر</option>
                <option
                  value="{{ option }}"
                  *ngFor="let option of genderList; let i = index"
                >
                  {{ option }}
                </option>
              </select>
            </div>
            <small
              id=""
              class="form-text text-danger mt-1"
              *ngIf="volDataGroup.get('gender')?.errors?.['required'] && volDataGroup.get('gender')?.touched && volDataGroup.get('gender')?.value == ''"
              >{{ "ValidationMsgs.mandatory" | translate }}</small
            >
          </div>
          <div class="my-3 col-md-6 col-12 num-of-seats">
            <p>عدد المقاعد</p>
            <p>1</p>
          </div>
        </div>
        <!-- volInvitation -->
        <div *ngIf="volDataType?.value == 'volInvitation'" class="row">
          <div class="my-3 col-md-6 col-12 vol-name">
            <label for="volName" class="form-label mb-2">اسم المتطوع</label>
            <div class="mb-3">
              <select
                class="form-select"
                name="volName"
                id="volName"
                formControlName="volName"
                [class.is-invalid]="
                  volDataGroup.get('volName')?.invalid &&
                  volDataGroup.get('volName')?.touched &&
                  volDataGroup.get('volName')?.value == ''
                "
                [class.is-valid]="
                  volDataGroup.get('volName')?.valid &&
                  volDataGroup.get('volName')?.value != ''
                "
              >
                <option value="">اختر</option>
                <option
                  value="{{ option }}"
                  *ngFor="let option of volNameList; let i = index"
                >
                  {{ option }}
                </option>
              </select>
            </div>
            <small
              id=""
              class="form-text text-danger mt-1"
              *ngIf="volDataGroup.get('volName')?.errors?.['required'] && volDataGroup.get('volName')?.touched && volDataGroup.get('volName')?.value == ''"
              >{{ "ValidationMsgs.mandatory" | translate }}</small
            >
          </div>
          <div class="my-3 col-md-6 col-12 num-of-seats">
            <p>عدد المقاعد</p>
            <p>1</p>
          </div>
        </div>
        <!-- customizeOpp -->
        <div *ngIf="volDataType?.value == 'customizeOpp'" class="row">
          <div class="my-3 col-md-6 col-12 customizeOppForCustomSector">
            <label for="customizeOppForCustomSector" class="form-label mb-2"
              >تخصيص الفرصة لقسم معين
            </label>
            <div class="mb-3">
              <select
                class="form-select"
                name="customizeOppForCustomSector"
                id="customizeOppForCustomSector"
                formControlName="customizeOppForCustomSector"
                [class.is-invalid]="
                  volDataGroup.get('customizeOppForCustomSector')?.invalid &&
                  volDataGroup.get('customizeOppForCustomSector')?.touched &&
                  volDataGroup.get('customizeOppForCustomSector')?.value == ''
                "
                [class.is-valid]="
                  volDataGroup.get('customizeOppForCustomSector')?.valid &&
                  volDataGroup.get('customizeOppForCustomSector')?.value != ''
                "
              >
                <option value="">اختر</option>
                <option
                  value="{{ option }}"
                  *ngFor="
                    let option of customizeOppForCustomSectorList;
                    let i = index
                  "
                >
                  {{ option }}
                </option>
              </select>
            </div>
            <small
              id=""
              class="form-text text-danger mt-1"
              *ngIf="volDataGroup.get('customizeOppForCustomSector')?.errors?.['required'] && volDataGroup.get('customizeOppForCustomSector')?.touched && volDataGroup.get('customizeOppForCustomSector')?.value == ''"
              >{{ "ValidationMsgs.mandatory" | translate }}</small
            >
          </div>
          <div class="my-3 col-md-6 col-12 num-of-seats">
            <p>عدد المقاعد</p>
            <p>1</p>
          </div>
          <div class="my-3 col-md-6 col-12 gender">
            <label for="gender" class="form-label mb-2">الجنس</label>
            <div class="mb-3">
              <select
                class="form-select"
                name="gender"
                id="gender"
                formControlName="gender"
                [class.is-invalid]="
                  volDataGroup.get('gender')?.invalid &&
                  volDataGroup.get('gender')?.touched &&
                  volDataGroup.get('gender')?.value == ''
                "
                [class.is-valid]="
                  volDataGroup.get('gender')?.valid &&
                  volDataGroup.get('gender')?.value != ''
                "
              >
                <option value="">اختر</option>
                <option
                  value="{{ option }}"
                  *ngFor="let option of genderList; let i = index"
                >
                  {{ option }}
                </option>
              </select>
            </div>
            <small
              id=""
              class="form-text text-danger mt-1"
              *ngIf="volDataGroup.get('gender')?.errors?.['required'] && volDataGroup.get('gender')?.touched && volDataGroup.get('gender')?.value == ''"
              >{{ "ValidationMsgs.mandatory" | translate }}</small
            >
          </div>
        </div>
      </form>
    </div>
    <!-- {{ volDataForm.value | json }} -->
    <!-- <br /> -->
    <!-- {{ volDataForm.status | json }} -->
  </form>
  <div class="card-footer border-0 bg-transparent row">
    <div class="row col-10">
      <button
        type="submit"
        (click)="prevStep()"
        class="btn col-3 d-flex justify-content-center align-items-center fw-bold"
      >
        السابق
      </button>
      <button
        data-bs-toggle="modal"
        data-bs-target="#cancelModal"
        class="btn btn-danger col-3 d-flex justify-content-center align-items-center fw-bold"
      >
        إلغاء
      </button>
    </div>

    <div class="col-2">
      <button
        type="submit"
        (click)="printForm(); nextStep(); removeClassesinParent()"
        class="btn btn-primary d-flex justify-content-center align-items-center fw-bold"
        [disabled]="volDataForm.invalid"
      >
        التالى
      </button>
    </div>
  </div>
</div>

<section class="wizard container mt-5">
  <div class="row flex-column flex-md-row">
    <ul
      class="wizard-steps-header col-md-4 col-12 d-flex flex-row flex-md-column"
    >
      <li
        #headerStepOne
        class="active-header-step d-flex flex-column jusfify-content-center align-items-center col flex-md-row"
      >
        <div
          class="circle col-4 d-flex justify-content-center align-items-center"
        >
          <!-- <span>1</span> -->1
        </div>
        <h6>البيانات الأساسية</h6>
      </li>
      <li
        class="d-flex flex-column jusfify-content-center align-items-center col flex-md-row"
        #headerStepTwo
      >
        <div class="circle d-flex justify-content-center align-items-center">
          <!-- <span>2</span> -->2
        </div>
        <h6>بيانات المتطوعين</h6>
      </li>
      <li
        class="d-flex flex-column jusfify-content-center align-items-center col flex-md-row"
        #headerStepThree
      >
        <div class="circle d-flex justify-content-center align-items-center">
          <!-- <span>3</span> -->3
        </div>
        <h6>بيانات المستفيدين</h6>
      </li>
      <li
        class="d-flex flex-column jusfify-content-center align-items-center col flex-md-row"
        #headerStepFour
      >
        <div class="circle d-flex justify-content-center align-items-center">
          <!-- <span>4</span> -->4
        </div>
        <h6>نموذج تقديم طلب المستفيد</h6>
      </li>
      <li
        class="d-flex flex-column jusfify-content-center align-items-center col flex-md-row"
        #headerStepFive
      >
        <div class="circle d-flex justify-content-center align-items-center">
          <!-- <span>5</span> -->5
        </div>
        <h6>الوقت</h6>
      </li>
      <li
        class="d-flex flex-column jusfify-content-center align-items-center col flex-md-row"
        #headerStepSix
      >
        <div class="circle d-flex justify-content-center align-items-center">
          <!-- <span>6</span> -->6
        </div>
        <h6>المشاركة</h6>
      </li>
    </ul>
    <div class="wizard-content col-md-8 col-12">
      <div class="card">
        <div class="card-body row justify-content-evenly">
          <section #stepOne class="wizard-step active-step">
            <app-work-shop-main-data
              (removeClasses)="removeClasses()"
              (activeStepTwo)="putActiveClass($event)"
            ></app-work-shop-main-data>
          </section>
          <section #stepTwo class="wizard-step next-step">
            <app-work-shop-vol-data
              (removeClasses)="removeClasses()"
              (activeStepThree)="putActiveClass($event)"
              (backToPrevStep)="goBack()"
            >
            </app-work-shop-vol-data>
          </section>
          <section #stepThree class="wizard-step next-step">
            <app-work-shop-beneficiary-data
              (removeClasses)="removeClasses()"
              (activeStepFour)="putActiveClass($event)"
              (backToPrevStep)="goBack()"
            ></app-work-shop-beneficiary-data>
          </section>
          <section #stepFour class="wizard-step next-step">
            <app-work-shop-survay-questions
              (removeClasses)="removeClasses()"
              (activeStepFive)="putActiveClass($event)"
              (backToPrevStep)="goBack()"
            ></app-work-shop-survay-questions>
          </section>
          <section #stepFive class="wizard-step next-step">
            <app-work-shop-time
              (removeClasses)="removeClasses()"
              (activeStepSix)="putActiveClass($event)"
              (backToPrevStep)="goBack()"
            ></app-work-shop-time>
          </section>
          <section #stepSix class="wizard-step next-step">
            <app-work-shop-participation
              (removeClasses)="removeClasses()"
              (backToPrevStep)="goBack()"
            ></app-work-shop-participation>
          </section>
        </div>
      </div>
    </div>
    <app-cancel-modal
      class="modal fade"
      id="cancelModal"
      tabindex="-1"
      aria-labelledby="cancelModalLabel"
      aria-hidden="true"
    ></app-cancel-modal>
    <app-confirm-add-opp
      class="modal fade"
      id="confirmAddOppModal"
      tabindex="-1"
      aria-labelledby="confirmAddOppModalLabel"
      aria-hidden="true"
    ></app-confirm-add-opp>
  </div>
</section>
